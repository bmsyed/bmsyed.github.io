<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }
    header {
      background: #333;
      color: white;
      padding: 1em;
      text-align: center;
    }
    header button {
      margin: 0 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background: #555;
      color: white;
      cursor: pointer;
    }
    header button:hover {
      background: #777;
    }
    section {
      height: 100vh; /* full screen sections */
      padding: 2em;
    }
    #home { background: lightblue; }
    #about { background: lightgreen; }
    #contact { background: lightcoral; }
  </style>
</head>
<body>

  <header>
    <h1>My Website</h1>
    <button onclick="scrollToSection('home')">Home</button>
    <button onclick="scrollToSection('about')">About</button>
    <button onclick="scrollToSection('contact')">Contact</button>
  </header>

  <section id="home"><h2>Home Section</h2></section>
  <section id="about"><h2>About Section</h2></section>
  <section id="contact"><h2>Contact Section</h2></section>

  <script>
    function scrollToSection(sectionId) {
      document.getElementById(sectionId).scrollIntoView({ 
        behavior: 'smooth' 
      });
    }
  </script>

</body>
</html>
